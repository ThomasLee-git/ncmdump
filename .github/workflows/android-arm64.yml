name: Android arm64

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch bundled TagLib source
        run: |
          mkdir -p "${{ github.workspace }}/deps"
          curl -L \
            -o "${{ github.workspace }}/deps/taglib-2.3.tar.gz" \
            "https://github.com/taglib/taglib/releases/download/v2.3/taglib-2.3.tar.gz"
          echo "7349f6fd942418bc7009ebe743eb7c9d055f02921ec56fa436ec25007c47fd38  ${{ github.workspace }}/deps/taglib-2.3.tar.gz" | sha256sum -c -
          tar -xzf "${{ github.workspace }}/deps/taglib-2.3.tar.gz" -C "${{ github.workspace }}/deps"

      - name: Fetch Android NDK r27d
        run: |
          mkdir -p "${{ github.workspace }}/.ndk"
          curl -L \
            -o "${{ github.workspace }}/.ndk/android-ndk-r27d-linux.zip" \
            "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip"
          echo "22105e410cf29afcf163760cc95522b9fb981121  ${{ github.workspace }}/.ndk/android-ndk-r27d-linux.zip" | sha1sum -c -
          unzip -q "${{ github.workspace }}/.ndk/android-ndk-r27d-linux.zip" -d "${{ github.workspace }}/.ndk"

      - name: Configure
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/.ndk/android-ndk-r27d
        run: |
          cmake -S "${{ github.workspace }}/ports/android-cli" \
                -B "${{ github.workspace }}/build-android-arm64" \
                -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-23 \
                -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "${{ github.workspace }}/build-android-arm64" --parallel

      - name: Verify architecture
        run: |
          file "${{ github.workspace }}/build-android-arm64/ncmdump"
          "${{ github.workspace }}/.ndk/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "${{ github.workspace }}/build-android-arm64/ncmdump"
          "${{ github.workspace }}/.ndk/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "${{ github.workspace }}/build-android-arm64/ncmdump" | grep "Machine:.*AArch64"

      - name: Package
        run: |
          mkdir -p "${{ github.workspace }}/artifacts"
          cp "${{ github.workspace }}/build-android-arm64/ncmdump" "${{ github.workspace }}/artifacts/ncmdump-android-arm64"
          chmod +x "${{ github.workspace }}/artifacts/ncmdump-android-arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncmdump-android-arm64
          path: ${{ github.workspace }}/artifacts/ncmdump-android-arm64
